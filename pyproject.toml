[project]
name = "aceyducey"
version = "1.0.0"
description = "Acey-Ducey card game — a 2026 reimagining of Bill Palmby's 1973 BASIC classic."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "aceyduceypy contributors" }]
keywords = ["game", "cards", "tui", "textual", "retro", "basic", "acey-ducey"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Terminals",
    "Typing :: Typed",
]
dependencies = [
    "textual>=0.85",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "structlog>=24.1",
]

[project.urls]
Homepage = "https://github.com/davidvivo-ia/aceyduceypy"
Issues = "https://github.com/davidvivo-ia/aceyduceypy/issues"

[project.scripts]
aceyducey = "aceyducey.__main__:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.103",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "textual-dev>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aceyducey"]

[tool.hatch.build.targets.wheel.force-include]
"src/aceyducey/assets" = "aceyducey/assets"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "B",          # bugbear
    "C4",         # comprehensions
    "UP",         # pyupgrade
    "SIM",        # simplify
    "RUF",        # ruff-specific
    "N",          # pep8-naming
    "PT",         # pytest-style
    "PL",         # pylint subset
    "TID",        # tidy imports
    "TRY",        # tryceratops
    "PERF",       # perflint
    "FURB",       # refurb
    "ANN",        # annotations
    "D",          # pydocstyle
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "ANN401",
    "PLR0913",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "PLR2004", "S101"]
"src/aceyducey/presentation/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_ignores = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["textual.*", "structlog.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/aceyducey"]
omit = [
    "src/aceyducey/__main__.py",
    "src/aceyducey/presentation/cli.py",
    "src/aceyducey/presentation/screens.py",
    "src/aceyducey/presentation/tui_app.py",
    "src/aceyducey/presentation/widgets.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
